    <link href="https://fonts.googleapis.com/css2?family=VT323&family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
    <style>
      body {
        background-color: #000;
        color: #eab308; /* yellow-500 */
        font-family: 'VT323', monospace;
        overflow: hidden;
      }
      /* Custom Scrollbar for Terminal */
      ::-webkit-scrollbar {
        width: 8px;
      }
      ::-webkit-scrollbar-track {
        background: #1a1a1a;
      }
      ::-webkit-scrollbar-thumb {
        background: #4b5563;
      }
      ::-webkit-scrollbar-thumb:hover {
        background: #ca8a04;
      }
      
      .crt-flicker {
        animation: flicker 0.15s infinite;
      }
      
      @keyframes flicker {
        0% { opacity: 0.97; }
        50% { opacity: 1; }
        100% { opacity: 0.98; }
      }

      .scanline {
        width: 100%;
        height: 100px;
        z-index: 10;
        background: linear-gradient(0deg, rgba(0,0,0,0) 0%, rgba(255, 255, 255, 0.04) 50%, rgba(0,0,0,0) 100%);
        opacity: 0.1;
        position: absolute;
        bottom: 100%;
        animation: scanline 10s linear infinite;
        pointer-events: none;
      }

      @keyframes scanline {
        0% { bottom: 100%; }
        100% { bottom: -100%; }
      }

      @keyframes flashlight-sway {
        0% { transform: translate(-50%, -50%); }
        25% { transform: translate(-45%, -55%); }
        50% { transform: translate(-50%, -48%); }
        75% { transform: translate(-55%, -52%); }
        100% { transform: translate(-50%, -50%); }
      }
      
      .animate-flashlight-sway {
        animation: flashlight-sway 12s ease-in-out infinite;
      }
    </style>
